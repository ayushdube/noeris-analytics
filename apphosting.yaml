# Firebase App Hosting — https://noeris.io
# Project: noerisanalyticsio | Backend: noerisanalytics | Region: asia-southeast1
#
# Sensitive values belong in Cloud Secret Manager (not committed):
#   firebase apphosting:secrets:set DATABASE_URL
#   firebase apphosting:secrets:set RESEND_API_KEY
# Or set them in Firebase Console → App Hosting → noerisanalytics → Environment
#
# Console values override this file. Changes apply on the next rollout.

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://noeris.io
    availability:
      - BUILD
      - RUNTIME

